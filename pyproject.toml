[project]
name = "agent-platform"
version = "0.1.0"
description = "Local-first autonomous software engineering platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
